<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>911 Urban Salón — Panel</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#09090B">
<style>
@import url("https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap");
/* ══ Sistema visual del panel: zinc oscuro estilo dashboard + acento 911 ══ */
:root{
  --bg:#09090B; --panel:#0E0E11; --card:#131317; --raised:#1B1B21; --hover:#202028;
  --line:rgba(250,250,250,.08); --line-2:rgba(250,250,250,.16);
  --tx:#FAFAFA; --tx-2:#B8B8C2; --tx-3:#80808C;
  --brand:#F07A28; --brand-2:#F8A96B; --brand-soft:rgba(240,122,40,.14);
  --ok:#3FB56B; --ok-soft:rgba(63,181,107,.14);
  --warn:#E8A31C; --warn-soft:rgba(232,163,28,.14);
  --bad:#E5484D; --bad-soft:rgba(229,72,77,.14);
  --info:#2E9BF0; --info-soft:rgba(46,155,240,.14);
  --r:12px; --r-sm:8px;
  --ui:"Barlow",system-ui,sans-serif; --cond:"Barlow Condensed",sans-serif;
  --disp:"Anton",sans-serif; --mono:ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx-2);font:400 15px/1.55 var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit}
::selection{background:var(--brand-soft)}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:4px}

.eyebrow{font:600 11px/1 var(--cond);text-transform:uppercase;letter-spacing:.12em;color:var(--tx-3)}
h1,h2,h3{margin:0;color:var(--tx)}

.btn{display:inline-flex;align-items:center;gap:8px;font:600 13px/1 var(--cond);text-transform:uppercase;letter-spacing:.06em;
  border:1px solid transparent;border-radius:var(--r-sm);padding:0 14px;height:36px;transition:all .15s ease;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--brand);color:#0A0A0B}
.btn.primary:hover{background:#F49048}
.btn.outline{border-color:var(--line-2);color:var(--tx)}
.btn.outline:hover{background:var(--hover)}
.btn.ghost{color:var(--tx-2)}
.btn.ghost:hover{background:var(--hover);color:var(--tx)}
.btn.danger{background:var(--bad-soft);color:#FF8A8E;border-color:rgba(229,72,77,.35)}
.btn.ok{background:var(--ok-soft);color:#7BE0A3;border-color:rgba(63,181,107,.35)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.xl{height:46px;padding:0 22px;font-size:15px}
.btn:disabled{opacity:.4;pointer-events:none}
.icon-btn{display:grid;place-items:center;width:30px;height:30px;border-radius:var(--r-sm);color:var(--tx-3)}
.icon-btn:hover{background:var(--hover);color:var(--tx)}

.badge{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--cond);text-transform:uppercase;letter-spacing:.08em;
  border-radius:999px;padding:5px 10px;border:1px solid var(--line-2);color:var(--tx-2)}
.badge .pt{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-soft);color:#7BE0A3;border-color:rgba(63,181,107,.3)}
.badge.warn{background:var(--warn-soft);color:#F5C56B;border-color:rgba(232,163,28,.3)}
.badge.bad{background:var(--bad-soft);color:#FF8A8E;border-color:rgba(229,72,77,.3)}
.badge.info{background:var(--info-soft);color:#7CC3F5;border-color:rgba(46,155,240,.3)}
.badge.brand{background:var(--brand-soft);color:var(--brand-2);border-color:rgba(240,122,40,.35)}
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.35}}
.vivo .pt{animation:pulso 1.6s infinite}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.input{width:100%;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-sm);color:var(--tx);
  padding:10px 12px;transition:border-color .15s}
.input:focus{outline:none;border-color:var(--brand)}
label.fld{display:grid;gap:6px}
label.fld>span{font:600 11px/1 var(--cond);text-transform:uppercase;letter-spacing:.1em;color:var(--tx-3)}

/* Layout */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.side .marca{display:flex;align-items:center;gap:10px}
.side .marca img{height:38px;border-radius:6px}
.side nav{display:grid;gap:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);
  font:600 13px/1 var(--cond);text-transform:uppercase;letter-spacing:.07em;color:var(--tx-2);text-align:left;width:100%}
.nav-item:hover{background:var(--hover);color:var(--tx)}
.nav-item.on{background:var(--brand-soft);color:var(--brand)}
.user-card{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.user-card .quien{display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--raised);display:grid;place-items:center;
  font:400 15px var(--disp);color:var(--brand)}
main.zona{padding:22px 26px;display:grid;gap:18px;align-content:start}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h1{font:400 26px/1 var(--disp);text-transform:uppercase;letter-spacing:.01em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.stat b{font:400 30px/1 var(--disp);color:var(--tx);font-weight:400}
.stat.naranja b{color:var(--brand)}

/* Tabla */
.tabla-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.turno-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:9px}
.turno-card.dim{opacity:.55}
table.tabla{width:100%;border-collapse:collapse;min-width:760px}
.tabla th{font:600 11px/1 var(--cond);text-transform:uppercase;letter-spacing:.1em;color:var(--tx-3);
  text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.tabla td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tabla tr:last-child td{border-bottom:0}
.tabla tr:hover td{background:rgba(250,250,250,.02)}
.cod{font:600 14px var(--mono);color:var(--brand);letter-spacing:.04em}
.tenue{color:var(--tx-3);font-size:13px}
tr.dim td{opacity:.45}

/* Menú contextual */
.menu-wrap{position:relative;display:inline-block}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:190px;background:var(--raised);
  border:1px solid var(--line-2);border-radius:var(--r-sm);padding:6px;display:grid;gap:2px;
  box-shadow:0 12px 32px rgba(0,0,0,.5)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:6px;
  font:500 13.5px/1.2 var(--ui);color:var(--tx-2)}
.menu button:hover{background:var(--hover);color:var(--tx)}
.menu button.rojo{color:#FF8A8E}
.menu .sep{height:1px;background:var(--line);margin:4px 6px}

/* Diálogos y toasts */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:20px}
.dialogo{width:min(420px,100%);background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);padding:20px;display:grid;gap:14px;
  box-shadow:0 24px 64px rgba(0,0,0,.6)}
.dialogo h3{font:700 17px/1.2 var(--cond);text-transform:uppercase;letter-spacing:.05em}
.toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:grid;gap:8px;max-width:min(360px,90vw)}
.toast{background:var(--raised);border:1px solid var(--line-2);border-left:3px solid var(--ok);border-radius:var(--r-sm);
  padding:11px 14px;font-size:13.5px;color:var(--tx);box-shadow:0 10px 28px rgba(0,0,0,.45);animation:entra .2s ease}
.toast.err{border-left-color:var(--bad)}
@keyframes entra{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* Sala */
/* Todas las vistas del panel llevan el arte de marca de fondo, tenue, con
   las tarjetas sólidas encima: los datos siguen mandando. */
.sala,.mi-dia,.resumen,.productos,.cola,.ajustes{position:relative;min-height:calc(100vh - 150px)}
.sala{display:grid;gap:16px;align-content:start}
.resumen,.productos,.cola,.ajustes{display:grid;gap:18px;align-content:start}
.sala::before,.mi-dia::before,.resumen::before,.productos::before,.cola::before,.ajustes::before{
  content:"";position:absolute;inset:-22px -26px;background:url('/assets/banner2.jpeg') center/cover;
  opacity:.14;border-radius:14px;pointer-events:none}
/* :not(.velo): los diálogos son overlay FIJO; sin la exclusión, esta regla
   (posterior en el archivo y de igual especificidad) los volvería relative
   y el velo quedaría incrustado en la vista en vez de cubrir la pantalla. */
.sala>*:not(.velo),.mi-dia>*:not(.velo),.resumen>*:not(.velo),.productos>*:not(.velo),.cola>*:not(.velo),.ajustes>*:not(.velo){position:relative}
.sillas{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.silla-card{background:var(--card);border:1px solid rgba(240,122,40,.35);border-radius:var(--r);padding:24px;display:grid;justify-items:center;gap:8px;position:relative;overflow:hidden}
.silla-card::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 200px at 50% 0%,var(--brand-soft),transparent 70%)}
.silla-card>*{position:relative}
.silla-card .grande{font:400 76px/1 var(--disp);color:var(--tx);letter-spacing:-.01em}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden}
.login::before{content:"";position:absolute;inset:0;background:url('/assets/banner2.jpeg') center/cover;opacity:.16}
.login .card{position:relative;width:min(380px,100%);display:grid;gap:16px;justify-items:center;padding:28px}
.login img{height:104px}

/* Barbero (móvil primero) */
.mi-dia{display:grid;gap:14px;max-width:680px}
.turno-item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}

@media (max-width:860px){
  /* minmax(0,1fr) y min-width:0: un track "1fr" y los items de grid/flex no
     encogen por debajo de su contenido, y la barra empujaba la página a 665px. */
  .shell{grid-template-columns:minmax(0,1fr)}
  .side,main.zona{min-width:0}
  .side{position:static;height:auto;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line)}
  .side nav{display:flex;gap:4px;flex:1}
  .user-card{margin:0;border:0;padding:0}
  /* !important: el markup trae display:grid inline y le ganaría al CSS. */
  .user-card .quien span.det{display:none !important}
  /* min-width:0 rompe el "min-width:auto" de flex: sin esto el nav no encoge
     y estira la barra entera más allá del viewport. */
  .side nav{flex:1 1 0;min-width:0;overflow-x:auto;scrollbar-width:none}
  .side nav::-webkit-scrollbar{display:none}
  .nav-item{white-space:nowrap;flex:0 0 auto}
  .stats{grid-template-columns:repeat(2,1fr)}
  main.zona{padding:16px}
}
/* ── Teléfono: el panel se opera con el pulgar en el local ── */
@media (max-width:560px){
  .side{padding:8px 10px;gap:8px;position:sticky;top:0;z-index:40;background:var(--panel)}
  .side .marca img{height:28px}
  .side .marca div{display:none}
  /* La navegación desliza horizontal en vez de encoger los botones. */
  .side nav{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .side nav::-webkit-scrollbar{display:none}
  .nav-item{padding:10px 12px;white-space:nowrap;flex:0 0 auto}
  .topbar h1{font-size:21px}
  .topbar .tenue{display:none} /* la fecha completa no cabe; la cola ya dice el día */
  main.zona{padding:12px;gap:12px}
  .stats{gap:8px}
  .stat{padding:12px}
  .stat b{font-size:22px}
  /* Dedos, no cursores: todo lo tocable crece. */
  .btn{min-height:40px}
  .btn.sm{min-height:36px}
  .icon-btn{width:38px;height:38px}
  .tabla td{padding:12px 10px}
  .dialogo{max-height:88vh;overflow-y:auto}
  .velo{padding:10px;align-items:end;display:flex} /* el diálogo sube desde abajo, estilo hoja móvil */
  .dialogo{width:100%;border-radius:14px 14px 0 0}
  /* Ajustes: las filas del equipo (nombre/rol/especialidad en 3 columnas
     inline) se apilan — 3 inputs de 90px no se pueden escribir con el dedo. */
  div[style*="130px"]{grid-template-columns:1fr !important}
}
