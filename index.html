<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>911 Urban Salón — Barbería, spa y masajes</title>
<meta name="theme-color" content="#0A0A0B">
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
<style>
@import url("https://fonts.googleapis.com/css2?family=Anton&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Barlow+Condensed:wght@400;500;600;700&family=Permanent+Marker&display=swap");
/* ══ 911 Urban Salón — tokens: colores ══
   Every base value below was sampled from the brand artwork in assets/source/
   (logo, flujograma, horarios, background collage). Do not invent new hues. */
:root{
  /* ── Naranja · el color del graffiti (acción principal) ── */
  --naranja-50:#FEF1E6; --naranja-100:#FDDEC4; --naranja-200:#FABF92;
  --naranja-300:#F8A96B; --naranja-400:#F49048; --naranja-500:#F07A28;
  --naranja-600:#D6631A; --naranja-700:#A94B10; --naranja-800:#7A350A;
  --naranja-900:#4A1F05;

  /* ── Azul · el azul del logo y del poste de barbero (secundario) ── */
  --azul-50:#E7F2FA; --azul-100:#C7E1F4; --azul-200:#8FC2E7;
  --azul-300:#5FA8DE; --azul-400:#2E8ACC; --azul-500:#0F6BB4;
  --azul-600:#0A548F; --azul-700:#073A64; --azul-800:#052842;
  --azul-900:#031A2C;
  --azul-neon:#2E9BF0;      /* resplandor de neón del flyer de horarios */

  /* ── Negro · asfalto, papel quemado, muro ── */
  --negro-950:#050506; --negro-900:#0A0A0B; --negro-800:#131316;
  --negro-700:#1C1C21; --negro-600:#2A2A31; --negro-500:#3B3B44;
  --gris-400:#6E6E78; --gris-300:#8A8A94; --gris-200:#B9B9C2;
  --gris-100:#DEDEE3; --blanco:#F7F5F2;     /* blanco papel arrugado, cálido */

  /* ── Rojo 911 · poste de barbero, urgencia ── */
  --rojo-500:#D01F26; --rojo-600:#A81319; --rojo-100:#F9D6D7;
  /* ── Verde · confirmación del flujograma ("SÍ") ── */
  --verde-500:#2C8A52; --verde-600:#1E6B3D; --verde-100:#D3EEDD;
  /* ── Ámbar · espera / turno en curso ── */
  --ambar-500:#E8A31C; --ambar-100:#FBEBC6;

  /* ═══ Alias semánticos — usa SIEMPRE estos en componentes ═══ */
  --surface-page:var(--negro-900);
  --surface-card:var(--negro-800);
  --surface-raised:var(--negro-700);
  --surface-sunken:var(--negro-950);
  --surface-invert:var(--blanco);
  --surface-accent:var(--naranja-500);
  --surface-accent-soft:rgba(240,122,40,.12);
  --surface-blue-soft:rgba(15,107,180,.16);

  --text-strong:var(--blanco);
  --text-body:var(--gris-200);
  --text-muted:var(--gris-200);
  --text-faint:var(--gris-300);
  --text-accent:var(--naranja-500);
  --text-on-accent:var(--negro-950);   /* naranja es claro: texto negro */
  --text-on-blue:var(--blanco);
  --text-on-invert:var(--negro-900);

  --border-hair:rgba(247,245,242,.10);
  --border-soft:rgba(247,245,242,.18);
  --border-strong:rgba(247,245,242,.32);
  --border-accent:var(--naranja-500);
  --border-blue:var(--azul-500);

  --action-primary:var(--naranja-500);
  --action-primary-hover:var(--naranja-400);
  --action-primary-press:var(--naranja-600);
  --action-secondary:var(--azul-500);
  --action-secondary-hover:var(--azul-400);
  --action-secondary-press:var(--azul-600);
  --action-disabled:var(--negro-600);

  --status-libre:var(--verde-500);      /* barbero disponible */
  --status-turno:var(--ambar-500);      /* en atención / en espera */
  --status-ocupado:var(--rojo-500);     /* sin cupo */
  --status-info:var(--azul-neon);

  --focus-ring:var(--azul-neon);
}

/* Zona clara: secciones sobre papel blanco arrugado (flyers "bienvenido"). */
[data-tema="papel"]{
  --surface-page:var(--blanco);
  --surface-card:#FFFFFF;
  --surface-raised:#FFFFFF;
  --surface-sunken:#ECE9E4;
  --surface-invert:var(--negro-900);
  --text-strong:var(--negro-900);
  --text-body:#3A3A42;
  --text-muted:#63636D;
  --text-faint:var(--gris-300);
  --text-on-invert:var(--blanco);
  --border-hair:rgba(10,10,11,.10);
  --border-soft:rgba(10,10,11,.16);
  --border-strong:rgba(10,10,11,.30);
}

/* ══ Tokens: tipografía ══ */
:root{
  --font-display:"Anton","Barlow Condensed",Impact,sans-serif;   /* titulares póster */
  --font-condensed:"Barlow Condensed",sans-serif;                /* etiquetas, datos, botones */
  --font-body:"Barlow",system-ui,sans-serif;                     /* párrafos */
  --font-tag:"Permanent Marker",cursive;                         /* firmas de marcador, uso escaso */
  --font-mono:ui-monospace,"SFMono-Regular",Menlo,monospace;     /* códigos de turno */

  /* Escala tipo póster: salta fuerte entre niveles, sin pasos tímidos. */
  --fs-3xs:12px; --fs-2xs:13px; --fs-xs:14px; --fs-sm:16px; --fs-base:17px;
  --fs-lg:19px; --fs-xl:22px; --fs-2xl:28px; --fs-3xl:36px; --fs-4xl:48px;
  --fs-5xl:64px; --fs-6xl:84px; --fs-7xl:112px;

  --lh-tight:0.92;
  --lh-snug:1.15;
  --lh-normal:1.5;
  --lh-relaxed:1.65;

  --ls-tight:-0.02em;
  --ls-normal:0;
  --ls-wide:0.04em;
  --ls-wider:0.08em;
  --ls-widest:0.14em;

  --fw-light:300;
  --fw-regular:400;
  --fw-medium:500;
  --fw-semibold:600;
  --fw-bold:700;

  /* Roles */
  --type-hero:var(--fw-regular) var(--fs-7xl)/var(--lh-tight) var(--font-display);
  --type-display:var(--fw-regular) var(--fs-5xl)/var(--lh-tight) var(--font-display);
  --type-section:var(--fw-regular) var(--fs-4xl)/var(--lh-tight) var(--font-display);
  --type-title:var(--fw-bold) var(--fs-2xl)/var(--lh-snug) var(--font-condensed);
  --type-label:var(--fw-600,600) var(--fs-xs)/1.2 var(--font-condensed);
  --type-body:var(--fw-regular) var(--fs-base)/var(--lh-relaxed) var(--font-body);
  --type-small:var(--fw-regular) var(--fs-sm)/var(--lh-normal) var(--font-body);
}

/* ══ Tokens: espaciado y medidas. Base 4px. ══ */
:root{
  --sp-0:0; --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px;
  --sp-20:80px; --sp-24:96px; --sp-32:128px;

  --section-y:96px;        /* respiro vertical entre secciones de landing */
  --section-y-tight:64px;
  --gutter:24px;           /* margen lateral en móvil */
  --container:1200px;      /* ancho máximo de contenido */
  --container-narrow:760px;/* columnas de lectura */

  --card-pad:24px;
  --card-pad-lg:32px;
  --control-h:48px;        /* alto de botones e inputs */
  --control-h-sm:38px;
  --control-h-lg:56px;
  --tap-min:48px;          /* área táctil mínima */
}

/* ══ Tokens: radios, bordes, sombras, desenfoque y movimiento ══ */
:root{
  /* Radios: la marca es de esténcil y cartel — esquinas casi rectas.
     Nada supera 16px salvo píldoras y avatares. */
  --radius-none:0;
  --radius-xs:2px;
  --radius-sm:4px;     /* botones, chips, inputs */
  --radius-md:10px;    /* tarjetas */
  --radius-lg:16px;    /* paneles grandes, modales */
  --radius-pill:999px; /* badges, avatares */

  --border-w:1px;
  --border-w-thick:2px;
  --border-w-stencil:3px;

  /* Sombras: negro profundo, nunca sombras de color salvo el glow de acento. */
  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 2px 8px rgba(0,0,0,.45);
  --shadow-md:0 8px 24px rgba(0,0,0,.5);
  --shadow-lg:0 20px 48px rgba(0,0,0,.6);
  --shadow-inset:inset 0 1px 0 rgba(247,245,242,.06);
  --glow-naranja:0 0 0 1px rgba(240,122,40,.5),0 8px 28px rgba(240,122,40,.28);
  --glow-azul:0 0 0 1px rgba(46,155,240,.5),0 8px 28px rgba(46,155,240,.30);
  --glow-neon:0 0 12px rgba(46,155,240,.85),0 0 32px rgba(46,155,240,.45);

  /* Desenfoque: solo en capas flotantes sobre foto o textura. */
  --blur-sm:6px;
  --blur-md:14px;
  --blur-lg:28px;
  --scrim-top:linear-gradient(to bottom,rgba(5,5,6,.92),rgba(5,5,6,0));
  --scrim-bottom:linear-gradient(to top,rgba(5,5,6,.95),rgba(5,5,6,.35) 45%,rgba(5,5,6,0));

  /* Movimiento */
  --dur-instant:90ms;
  --dur-fast:180ms;
  --dur-base:280ms;
  --dur-slow:520ms;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-in-out:cubic-bezier(.65,0,.35,1);
  --ease-snap:cubic-bezier(.34,1.4,.5,1);
  --lift:translateY(-3px);
  --press:translateY(1px) scale(.985);
}
@media (prefers-reduced-motion:reduce){
  :root{
    --dur-fast:0ms;
    --dur-base:0ms;
    --dur-slow:0ms;
    --lift:none;
  }
}

/* ══ Reset mínimo y utilidades de marca ══ */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--surface-page);color:var(--text-body);font:var(--type-body);-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1,h2,h3,h4{margin:0;color:var(--text-strong)}
h1,h2{font-family:var(--font-display);font-weight:400;line-height:var(--lh-tight);text-transform:uppercase}
h3,h4{font-family:var(--font-condensed);font-weight:700;line-height:var(--lh-snug);text-transform:uppercase;letter-spacing:var(--ls-wide)}
p{margin:0 0 var(--sp-4)}
a{color:var(--text-accent);text-decoration:none;transition:color var(--dur-fast) var(--ease-out)}
a:hover{color:var(--naranja-300)}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
img{max-width:100%;display:block}

/* Kicker / overline: la etiqueta condensada que precede a cada titular. */
.u-kicker{font:600 var(--fs-2xs)/1 var(--font-condensed);text-transform:uppercase;letter-spacing:var(--ls-widest);color:var(--naranja-500)}
/* Firma de marcador — máximo una por pantalla. */
.u-tag{font-family:var(--font-tag);color:var(--naranja-500);transform:rotate(-3deg);display:inline-block}
/* Barra de acento bajo un titular. */
.u-rule{width:64px;height:4px;background:var(--naranja-500);border:0}
/* Textura de muro: se aplica al fondo de página, nunca dentro de tarjetas. */
.u-wall{background-image:url("assets/texture-graffiti-black.jpeg");background-size:cover;background-position:center}
.u-wall-dim::after{content:"";position:absolute;inset:0;background:rgba(5,5,6,.82)}
.u-container{width:100%;max-width:var(--container);margin-inline:auto;padding-inline:var(--gutter)}

/* ══ Página ══ */
html{scroll-behavior:smooth}
[data-aos]{pointer-events:auto}


/* ══ Adaptación móvil ══
   Los layouts del bundle usan estilos inline; estas reglas los colapsan
   por selector de atributo en pantallas angostas. */
@media (max-width: 960px){
  :root{ --fs-7xl:72px; --fs-6xl:52px; --fs-5xl:46px; --fs-4xl:38px; --section-y:72px; }
  div[style*="repeat(4"]{ grid-template-columns: repeat(2, 1fr) !important; }
  div[style*="repeat(3"]{ grid-template-columns: 1fr !important; }
  div[style*="1.15fr"], div[style*="1.55fr"], div[style*=".9fr"], div[style*=".8fr"],
  div[style*="1.2fr"], div[style*="grid-template-columns: 1fr 1fr"]{ grid-template-columns: 1fr !important; }
}
@media (max-width: 640px){
  :root{ --fs-7xl:56px; --fs-6xl:42px; --fs-5xl:38px; --fs-4xl:32px; --fs-3xl:26px; --fs-2xl:24px; --section-y:56px; --card-pad-lg:20px; --card-pad:18px; }
  header{ flex-wrap: wrap; gap: var(--sp-3) !important; }
  header nav{ display: none !important }
  div[style*="repeat(4"]{ grid-template-columns: 1fr !important; }
  div[style*="grid-template-columns: 1fr 1fr"]{ grid-template-columns: 1fr !important; }
}

<script type="text/babel" data-presets="react">
/* Reemplaza el TurnosAsistente del bundle: selector de servicio categorizado
   (cortes / spa / barbería) con chips más legibles: nombre grande, duración y precio. */
(() => {
const { SectionHeading, Card, Badge, Button, Icon, Input, OptionChip, StepIndicator, BarberCard, SlotPicker, QueueStatus, TurnoTicket } = window.Ds911UrbanSalNDesignSystem_1e06a9;

const DIAS = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

function proximosDias(n = 5) {
  const out = []; const d = new Date();
  while (out.length < n) {
    if (d.getDay() !== 2) out.push({ key: d.toDateString(), etiqueta: DIAS[d.getDay()] + " " + d.getDate(), largo: DIAS[d.getDay()] + " " + d.getDate() + " " + MESES[d.getMonth()] });
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
function construirJornadas(fechaKey, barbero, esSpa) {
  const H = window.DATA_911.horario || { apertura: 12, fin: 21, etiqueta: "12:00 p.m — 9:00 p.m" };
  const gen = (desde, hasta, nombre, rango) => {
    const slots = [];
    for (let m = desde * 60; m < hasta * 60; m += 45) {
      const hora = String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
      slots.push({ hora, tomado: hash(fechaKey + barbero + hora) % 10 < 3 });
    }
    return { nombre, rango, slots };
  };
  return [gen(H.apertura, H.fin, "Jornada única", H.etiqueta)];
}

function ChipServicio({ s, selected, onClick }) {
  return (
    <OptionChip selected={selected} onClick={onClick}>
      <span style={{ display: "grid", gap: 3, textAlign: "left", padding: "2px 0" }}>
        <span style={{ font: "700 var(--fs-sm)/1.1 var(--font-condensed)", textTransform: "uppercase", letterSpacing: "var(--ls-wide)" }}>{s.nombre}</span>
        <span style={{ font: "500 var(--fs-3xs)/1.1 var(--font-condensed)", textTransform: "uppercase", letterSpacing: "var(--ls-wider)", opacity: .75 }}>{s.dur}{s.precio ? " · " + s.precio : ""}</span>
      </span>
    </OptionChip>
  );
}

function TurnosAsistente({ servicioInicial }) {
  const D = window.DATA_911;
  const dias = React.useMemo(() => proximosDias(5), []);
  const grupos = [
    { titulo: "Cortes / motilados", icon: "scissors", items: D.cortes.map(c => ({ nombre: c.nombre, dur: c.dur, precio: c.precio, spa: false })) },
    { titulo: "Spa y masajes", icon: "hand-heart", items: D.spa.map(s => ({ nombre: s.nombre, dur: s.dur, precio: s.precio, spa: true })) },
    { titulo: "Barbería y otros", icon: "spray-can", items: (D.barberia || []).map(b => ({ nombre: b.nombre, dur: b.dur, precio: b.precio, spa: false })) }
  ].filter(g => g.items.length);
  const servicios = grupos.flatMap(g => g.items);

  const [paso, setPaso] = React.useState(0);
  const [servicio, setServicio] = React.useState(null);
  const [barbero, setBarbero] = React.useState(null);
  const [dia, setDia] = React.useState(dias[0].key);
  const [hora, setHora] = React.useState(null);
  const [nombre, setNombre] = React.useState("");
  const [tel, setTel] = React.useState("");
  const [turno, setTurno] = React.useState(null);
  const [auto, setAuto] = React.useState(false);

  React.useEffect(() => {
    if (!servicioInicial) return;
    const s = servicios.find(x => x.nombre === servicioInicial);
    if (s) { setServicio(s); setPaso(1); setBarbero(null); setHora(null); }
  }, [servicioInicial]);

  const esSpa = servicio ? servicio.spa : false;
  const equipo = D.equipo.filter(p => (p.rol.toLowerCase().includes("masajista") ? esSpa : !esSpa));
  const jornadas = React.useMemo(() => construirJornadas(dia, barbero || "", esSpa), [dia, barbero, esSpa]);

  function asignarAutomatico() {
    const s = servicio || servicios[0];
    const libres = D.equipo.filter(p => (p.rol.toLowerCase().includes("masajista") ? s.spa : !s.spa) && p.estado !== "ocupado");
    const cand = libres[0] || D.equipo[0];
    const js = construirJornadas(dias[0].key, cand.nombre, s.spa);

        <div style={{ display: "grid", gridTemplateColumns: "1.55fr 1fr", gap: "var(--sp-6)", alignItems: "start" }}>

            {paso < 4 && (

                <StepIndicator steps={pasos} current={paso} />
                <Button size="sm" variant="ghost" onClick={asignarAutomatico} iconLeft={<Icon name="zap" size={15} />}>Asignar por mí</Button>
              </div>
            )}

            {paso === 0 && (
              <div style={{ display: "grid", gap: "var(--sp-5)" }}>
                <span style={{ font: "600 var(--fs-2xs)/1 var(--font-condensed)", textTransform: "uppercase", letterSpacing: "var(--ls-wider)", color: "var(--text-muted)" }}>¿Qué te vas a hacer?</span>
                {grupos.map(g => (
                  <div key={g.titulo} style={{ display: "grid", gap: "var(--sp-3)" }}>
                    <span style={{ display: "flex", alignItems: "center", gap: 8, font: "700 var(--fs-xs)/1 var(--font-condensed)", textTransform: "uppercase", letterSpacing: "var(--ls-wider)", color: "var(--naranja-500)" }}>
                      <Icon name={g.icon} size={15} />{g.titulo}
                      <span style={{ flex: 1, height: 1, background: "var(--border-hair)" }} />

                      {g.items.map(s => (
                        <ChipServicio key={s.nombre} s={s} selected={servicio && servicio.nombre === s.nombre} onClick={() => { setServicio(s); setBarbero(null); setHora(null); }} />
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {paso === 1 && (
              <div style={{ display: "grid", gap: "var(--sp-3)" }}>
                <span style={{ font: "600 var(--fs-2xs)/1 var(--font-condensed)", textTransform: "uppercase", letterSpacing: "var(--ls-wider)", color: "var(--text-muted)" }}>¿Con quién?</span>
                {equipo.map(p => (
                  <BarberCard key={p.nombre} name={p.nombre} role={p.rol} estado={p.estado} nextSlot={p.proximo} specialty={p.especialidad}
                    selected={barbero === p.nombre} onClick={() => { if (p.estado !== "ocupado") { setBarbero(p.nombre); setHora(null); } }} />
                ))}
              </div>

            {paso === 2 && (

                  <div style={{ display: "flex", gap: "var(--sp-2)", flexWrap: "wrap" }}>
                    {dias.map(d => <OptionChip key={d.key} accent="azul" selected={dia === d.key} onClick={() => { setDia(d.key); setHora(null); }}>{d.etiqueta}</OptionChip>)}
                  </div>
                </div>
                <SlotPicker jornadas={jornadas} value={hora} onChange={setHora} />
              </div>
            )}

            {paso === 3 && (
              <div style={{ display: "grid", gap: "var(--sp-4)" }}>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "var(--sp-4)" }}>
                  <Input label="Tu nombre" placeholder="Como te llaman" value={nombre} onChange={e => setNombre(e.target.value)} icon={<Icon name="user-round" size={16} />} />
                  <Input label="WhatsApp" placeholder="300 000 0000" value={tel} onChange={e => setTel(e.target.value)} icon={<Icon name="phone" size={16} />} hint="Ahí te llega la confirmación" />
                </div>

  }else if(++intentos>150){
    clearInterval(iv);
    document.getElementById("root").innerHTML='<div style="min-height:60vh;display:grid;place-items:center;text-align:center;padding:40px;font:var(--type-body);color:var(--text-muted)"><div><strong style="font:400 36px/1 var(--font-display);text-transform:uppercase;color:var(--text-strong);display:block;margin-bottom:12px">Error al montar la página</strong>Los componentes del design system no cargaron. Recarga la página.</div></div>';
  }
},40);

</script>
